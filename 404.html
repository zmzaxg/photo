<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源路径解析中</title>
<style>
*{margin:0;padding:0;font-family:system-ui;box-sizing:border-box;}
body{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f6f7f9;
}
.box{
  background:#fff;
  padding:48px 32px;
  border-radius:12px;
  box-shadow:0 2px 16px rgba(0,0,0,0.08);
  text-align:center;
}
.load-text{font-size:16px;color:#333;}
.err-title{font-size:22px;color:#d32f2f;margin-bottom:12px;}
.err-desc{color:#666;margin-bottom:24px;}
.back-home{
  display:inline-block;
  padding:10px 22px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  border-radius:6px;
}
#errorDom{display:none;}
#tip-log{margin-top:15px;font-size:12px;color:#999;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <div id="loadingDom" class="load-text">正在匹配相册资源，请稍候...</div>
  <div id="errorDom">
    <h2 class="err-title">404 图片不存在</h2>
    <p class="err-desc">未找到对应相册文件夹或图片文件</p>
    <a class="back-home" href="/">返回相册首页</a>
  </div>
  <div id="tip-log"></div>
</div>

<script type="module">
const ALBUM_BASE = "/albums/"
const FOLDER_DATE_REG = /^(\d{4}-\d{2}-\d{2})-(.+)$/
const logDom = document.getElementById('tip-log')
function log(text){
  logDom.innerText += text + "\n"
  console.log(text)
}

// 修复：独立html页面glob扫描路径，使用项目根绝对匹配
const allImageGlobPaths = Object.keys(import.meta.glob('/public/albums/**/*.{jpg,jpeg,png,webp,avif}', { eager: false }))
log("扫描到全部资源数量："+allImageGlobPaths.length)

const allRealFilePaths = new Set()
const cleanDirToRealDir = new Map()

function buildFullIndex() {
  allImageGlobPaths.forEach(globPath => {
    const fullRealRel = globPath.replace("/public/albums/", "")
    allRealFilePaths.add(fullRealRel)
    const pathSegs = fullRealRel.split("/")
    const fileName = pathSegs.pop()
    let realDirPath = ""
    let cleanDirPath = ""
    for (const seg of pathSegs) {
      realDirPath = realDirPath ? `${realDirPath}/${seg}` : seg
      const pureName = seg.match(FOLDER_DATE_REG)?.[2] || seg
      cleanDirPath = cleanDirPath ? `${cleanDirPath}/${pureName}` : pureName
      cleanDirToRealDir.set(cleanDirPath, realDirPath)
    }
  })
  log("目录映射表总数："+cleanDirToRealDir.size)
}

function parseRequestUrl() {
  const path = location.pathname
  log("当前访问路径："+path)
  if (!path.startsWith(ALBUM_BASE)) return null
  const resourcePath = path.slice(ALBUM_BASE.length)
  const lastSlashIdx = resourcePath.lastIndexOf("/")
  if (lastSlashIdx <= 0) return null
  const cleanDir = resourcePath.slice(0, lastSlashIdx)
  const fileName = resourcePath.slice(lastSlashIdx + 1)
  log(`拆分目录:${cleanDir} 文件:${fileName}`)
  return { cleanDir, fileName }
}

function fileExists(realDir, fileName) {
  const fullRealRelPath = `${realDir}/${fileName}`
  return allRealFilePaths.has(fullRealRelPath)
}

function runRedirect() {
  buildFullIndex()
  // 无任何资源直接报错
  if(allImageGlobPaths.length === 0){
    log("致命错误：未扫描到任何图片文件，请检查public/albums目录")
    showError()
    return
  }
  const reqInfo = parseRequestUrl()
  if (!reqInfo) {
    log("路径解析失败")
    showError()
    return
  }
  const { cleanDir, fileName } = reqInfo
  const realDir = cleanDirToRealDir.get(cleanDir)
  if (!realDir) {
    log(`无匹配真实目录，查询key:${cleanDir}`)
    showError()
    return
  }
  log("匹配真实带日期目录："+realDir)
  if (!fileExists(realDir, fileName)) {
    log("目录存在，但对应图片文件不存在")
    showError()
    return
  }
  const targetUrl = `${location.origin}${ALBUM_BASE}${realDir}/${fileName}`
  log("跳转真实图片地址："+targetUrl)
  location.href = targetUrl
}

function showError() {
  document.getElementById("loadingDom").style.display = "none"
  document.getElementById("errorDom").style.display = "block"
}
runRedirect()
</script>
</body>
</html>
