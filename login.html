<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 - 2FA 验证</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #f5f7fa; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .login-box { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; margin-bottom: 20px; color: #1a1a1a; }
    .tip { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 16px; }
    .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #1d4ed8; }
    .error { color: #dc2626; font-size: 14px; text-align: center; margin: 10px 0; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box"> 
    <h2>管理员登录</h2>
    <div class="tip">密码 + 2FA 动态验证码 双重验证</div>
    <input type="password" id="pwd" placeholder="管理员密码" />
    <input type="text" id="code" placeholder="6位2FA验证码" maxlength="6" />
    <div id="error" class="error"></div>
    <button class="btn" id="loginBtn">登录</button>
    <a href="index.html" class="back-link">返回相册首页</a>
  </div>

  <script type="module">
    import { verifyTOTP } from "https://cdn.jsdelivr.net/npm/@otpjs/core@0.1.1/+esm";

    // ========== 核心校验：强制跳转逻辑 ==========
    const adminPwd = localStorage.getItem("admin_pwd");
    const secret = localStorage.getItem("2fa_secret");
    const ghOwner = localStorage.getItem("gh_owner");
    const ghRepo = localStorage.getItem("gh_repo");
    const ghToken = localStorage.getItem("gh_token");

    // 校验顺序：先检查配置 → 再检查账户初始化
    if (!adminPwd || !secret || !ghOwner || !ghRepo || !ghToken) {
      // 任何一项未配置，强制跳转到 admin.html 进行初始化/配置
      location.href = "admin.html";
    }

    // 登录逻辑
    const pwdEl = document.getElementById("pwd");
    const codeEl = document.getElementById("code");
    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");

    loginBtn.addEventListener("click", () => {
      const pwd = pwdEl.value.trim();
      const code = codeEl.value.trim();
      errorEl.textContent = "";

      if (pwd !== adminPwd) {
        errorEl.textContent = "密码错误";
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        errorEl.textContent = "请输入6位数字验证码";
        return;
      }
      const valid = verifyTOTP(secret, code);
      if (!valid) {
        errorEl.textContent = "验证码错误或已过期";
        return;
      }

      localStorage.setItem("admin_logged", "1");
      location.href = "admin.html";
    });
  </script>
</body>
</html>
