<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { padding: 20px; background: #f8f9fa; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #222; }
    .block { margin: 20px 0; padding: 16px; border: 1px solid #eee; border-radius: 6px; }
    input, button, select { padding: 8px 12px; margin: 6px 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; }
    .hidden { display: none; }
    .qrcode-box { margin: 10px 0; }
    .tip { color: #666; font-size: 13px; margin: 8px 0; }
    .file-list { margin-top: 15px; max-height: 400px; overflow-y: auto; }
    .file-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .alert { padding: 10px; background: #fef2f2; color: #dc2626; border-radius: 4px; margin: 10px 0; }
  </style>
  <!-- 2FA 二维码生成 + TOTP 验证 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/totp-js@1.0.0/dist/totp.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>相册管理后台</h2>
    <a href="index.html">← 返回首页</a>

    <!-- 全局提示 -->
    <div id="alertBox" class="alert hidden"></div>

    <!-- 第一步：初始化配置（GitHub Token + 仓库信息 + 2FA） -->
    <div id="configPanel" class="block">
      <h3>首次使用请完成配置（配置本地存储，仅当前浏览器生效）</h3>
      <p class="tip">1. 填写 GitHub 仓库信息 + 个人 Token；2. 绑定 2FA 二次验证</p>
      <div>
        <label>GitHub 用户名：</label>
        <input type="text" id="ghOwner" placeholder="例如：your-name">
      </div>
      <div>
        <label>GitHub 仓库名：</label>
        <input type="text" id="ghRepo" placeholder="例如：photo-album">
      </div>
      <div>
        <label>GitHub Token：</label>
        <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" style="width: 400px;">
      </div>
      <div class="block">
        <h4>2FA 二次验证绑定</h4>
        <p class="tip">请使用谷歌验证器/微软验证器扫描二维码，输入6位动态验证码完成绑定</p>
        <div class="qrcode-box" id="qrcode"></div>
        <div>
          <label>动态验证码：</label>
          <input type="text" id="totpCode" placeholder="6位数字">
          <button onclick="bind2FA()">确认绑定并保存配置</button>
        </div>
      </div>
    </div>

    <!-- 第二步：管理主面板（配置+验证通过后显示） -->
    <div id="mainPanel" class="hidden">
      <!-- 相册文件夹管理 -->
      <div class="block">
        <h3>相册文件夹管理（格式：YYYY-MM-dd-相册名）</h3>
        <div>
          <input type="text" id="newAlbumName" placeholder="2024-05-20-周末出游">
          <button onclick="createAlbum()">新建相册</button>
        </div>
        <div class="file-list" id="albumList"></div>
      </div>

      <!-- 图片上传管理 -->
      <div class="block">
        <h3>图片上传至相册</h3>
        <div>
          <select id="albumSelect"></select>
          <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp" multiple>
          <button onclick="uploadImage()" class="success">上传图片</button>
        </div>
        <p class="tip">支持 jpg / png / webp 格式</p>
      </div>

      <!-- 相册内文件列表 -->
      <div class="block">
        <h3>当前相册文件管理</h3>
        <select id="fileAlbumSelect" onchange="loadAlbumFiles()"></select>
        <div class="file-list" id="fileList"></div>
      </div>
    </div>
  </div>

  <script>
    // ========== 全局常量 & 本地存储 Key ==========
    const STORAGE_KEY = 'album_admin_config';
    const ALBUM_ROOT = 'public/albums/';
    let config = {
      owner: '',
      repo: '',
      token: '',
      totpSecret: '',
      isBind2FA: false
    };
    let totpSecret = '';

    // ========== 初始化 ==========
    window.onload = initAdmin;

    function initAdmin() {
      // 读取本地配置
      const local = localStorage.getItem(STORAGE_KEY);
      if (local) {
        config = JSON.parse(local);
        // 校验 2FA
        if (config.isBind2FA && config.totpSecret) {
          showMainPanel();
          refreshAllData();
          return;
        }
      }
      // 无配置 / 未绑定2FA：显示配置面板 + 生成2FA密钥二维码
      showConfigPanel();
      generate2FA();
    }

    // 显示提示信息
    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      box.innerText = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3000);
    }

    // 切换面板
    function showConfigPanel() {
      document.getElementById('configPanel').classList.remove('hidden');
      document.getElementById('mainPanel').classList.add('hidden');
    }
    function showMainPanel() {
      document.getElementById('configPanel').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');
    }

    // ========== 2FA 二次验证 ==========
    // 生成随机密钥 + 二维码
    function generate2FA() {
      // 生成 16 位随机密钥
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      totpSecret = '';
      for(let i=0;i<16;i++) totpSecret += chars[Math.floor(Math.random()*chars.length)];
      // TOTP 链接
      const issuer = 'EdgeOne相册';
      const account = 'admin';
      const otpUrl = `otpauth://totp/${issuer}:${account}?secret=${totpSecret}&issuer=${issuer}`;
      // 生成二维码
      QRCode.toCanvas(document.getElementById('qrcode'), otpUrl, { width: 200 });
    }

    // 绑定 2FA + 保存全部配置
    async function bind2FA() {
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();
      const code = document.getElementById('totpCode').value.trim();

      if(!owner || !repo || !token || !code) {
        showAlert('请填写完整信息并输入动态验证码');
        return;
      }

      // 校验 TOTP 验证码
      const valid = totp.verify(totpSecret, code);
      if(!valid) {
        showAlert('验证码错误，请重新扫描二维码并输入');
        return;
      }

      // 保存配置到本地
      config = {
        owner, repo, token,
        totpSecret,
        isBind2FA: true
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      showAlert('配置绑定成功！');
      showMainPanel();
      await refreshAllData();
    }

    // ========== GitHub API 通用请求封装 ==========
    async function ghApi(path, method = 'GET', body = null) {
      const headers = {
        'Authorization': `token ${config.token}`,
        'Accept': 'application/vnd.github.v3+json'
      };
      const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`;
      const opts = { method, headers };
      if(body) opts.body = JSON.stringify(body);

      const res = await fetch(url, opts);
      const data = await res.json();
      if(!res.ok) throw new Error(data.message || '请求失败');
      return data;
    }

    // ========== 相册文件夹操作 ==========
    // 刷新相册列表
    async function loadAlbumList() {
      try {
        const listDom = document.getElementById('albumList');
        const select1 = document.getElementById('albumSelect');
        const select2 = document.getElementById('fileAlbumSelect');
        listDom.innerHTML = '加载中...';
        select1.innerHTML = '';
        select2.innerHTML = '';

        const data = await ghApi(ALBUM_ROOT);
        // 筛选 YYYY-MM-dd- 格式文件夹
        const albums = data.filter(item =>
          item.type === 'dir' && /^\d{4}-\d{2}-\d{2}-/.test(item.name)
        );

        listDom.innerHTML = '';
        albums.forEach(album => {
          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `
            <span>${album.name}</span>
            <div>
              <button class="danger" onclick="deleteAlbum('${album.name}','${album.sha}')">删除</button>
            </div>
          `;
          listDom.appendChild(item);

          // 下拉选择框
          const opt1 = document.createElement('option');
          opt1.value = album.name;
          opt1.innerText = album.name;
          select1.appendChild(opt1);

          const opt2 = document.createElement('option');
          opt2.value = album.name;
          opt2.innerText = album.name;
          select2.appendChild(opt2);
        });
      } catch (e) {
        showAlert('加载相册失败：' + e.message);
      }
    }

    // 新建相册文件夹
    async function createAlbum() {
      const name = document.getElementById('newAlbumName').value.trim();
      if(!/^\d{4}-\d{2}-\d{2}-.+$/.test(name)) {
        showAlert('文件夹格式必须为：YYYY-MM-dd-相册名');
        return;
      }
      try {
        const path = ALBUM_ROOT + name + '/.keep';
        // 创建空文件占位（GitHub 不允许空目录）
        await ghApi(path, 'PUT', {
          message: `新建相册 ${name}`,
          content: ''
        });
        showAlert('相册创建成功');
        document.getElementById('newAlbumName').value = '';
        await loadAlbumList();
      } catch (e) {
        showAlert('创建失败：' + e.message);
      }
    }

    // 删除相册文件夹
    async function deleteAlbum(name, sha) {
      if(!confirm(`确定删除相册 ${name}？内部图片将全部丢失！`)) return;
      try {
        // 先递归删除目录下所有文件（简化：直接删除占位文件，再刷新）
        await ghApi(ALBUM_ROOT + name + '/.keep', 'DELETE', {
          message: `删除相册 ${name}`,
          sha
        });
        showAlert('相册已删除');
        await loadAlbumList();
      } catch (e) {
        showAlert('删除失败：' + e.message);
      }
    }

    // ========== 图片上传 & 文件管理 ==========
    // 加载单个相册内文件
    async function loadAlbumFiles() {
      const album = document.getElementById('fileAlbumSelect').value;
      if(!album) return;
      try {
        const listDom = document.getElementById('fileList');
        listDom.innerHTML = '加载中...';
        const data = await ghApi(ALBUM_ROOT + album);
        const imgs = data.filter(item => /\.(jpg|jpeg|png|webp)$/i.test(item.name));

        listDom.innerHTML = '';
        imgs.forEach(file => {
          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `
            <span>${file.name}</span>
            <button class="danger" onclick="deleteFile('${album}','${file.name}','${file.sha}')">删除</button>
          `;
          listDom.appendChild(item);
        });
      } catch (e) {
        showAlert('加载文件失败：' + e.message);
      }
    }

    // 上传图片
    async function uploadImage() {
      const album = document.getElementById('albumSelect').value;
      const files = document.getElementById('imgFile').files;
      if(!album || files.length === 0) {
        showAlert('请选择相册和图片文件');
        return;
      }
      try {
        for(const file of files) {
          // 文件转 base64
          const base64 = await fileToBase64(file);
          const path = ALBUM_ROOT + album + '/' + file.name;
          await ghApi(path, 'PUT', {
            message: `上传图片 ${file.name}`,
            content: base64.split(',')[1]
          });
        }
        showAlert('图片上传完成');
        document.getElementById('imgFile').value = '';
        await loadAlbumFiles();
      } catch (e) {
        showAlert('上传失败：' + e.message);
      }
    }

    // 删除单张图片
    async function deleteFile(album, filename, sha) {
      if(!confirm(`确定删除图片 ${filename}？`)) return;
      try {
        const path = ALBUM_ROOT + album + '/' + filename;
        await ghApi(path, 'DELETE', {
          message: `删除图片 ${filename}`,
          sha
        });
        showAlert('图片已删除');
        await loadAlbumFiles();
      } catch (e) {
        showAlert('删除失败：' + e.message);
      }
    }

    // 文件转 Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 刷新全部数据
    async function refreshAllData() {
      await loadAlbumList();
      await loadAlbumFiles();
    }
  </script>
</body>
</html>
