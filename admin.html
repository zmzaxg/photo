<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册管理后台 - Win10 风格</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #f3f3f3; padding: 0; }
    .container { display: flex; height: 100vh; }

    /* 侧边栏目录树 */
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar h3 { font-size: 16px; margin-bottom: 12px; color: #333; }
    .tree-item {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
    }
    .tree-item:hover { background: #e5e5e5; }
    .tree-item.active { background: #0078d4; color: #fff; }
    .tree-icon { font-size: 16px; }

    /* 主内容区 */
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .toolbar {
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .breadcrumb {
      flex: 1;
      font-size: 14px;
      color: #0078d4;
    }
    .breadcrumb a { color: #0078d4; text-decoration: none; cursor: pointer; }
    .breadcrumb a:hover { text-decoration: underline; }
    .toolbar button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary { background: #0078d4; color: #fff; }
    .btn-success { background: #107c10; color: #fff; }
    .btn-danger { background: #d83b01; color: #fff; }

    /* 文件列表 */
    .file-list {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .file-item {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .file-item:hover { border-color: #0078d4; }
    .file-icon { font-size: 48px; color: #0078d4; }
    .file-icon.folder { color: #ffb900; }
    .file-name { font-size: 13px; text-align: center; word-break: break-all; }
    .file-info { font-size: 11px; color: #666; }

    /* 配置弹窗 */
    .config-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .modal-box { background: #fff; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; }
    input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 4px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 配置弹窗 -->
  <div id="configModal" class="config-modal hidden">
    <div class="modal-box">
      <h3>系统初始化配置</h3>
      <p>请填写 GitHub 仓库信息：</p>
      <input type="text" id="repoUrl" placeholder="https://github.com/用户名/仓库名">
      <input type="text" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
      <button class="btn-primary" id="saveConfig">保存配置</button>
    </div>
  </div>

  <div class="container">
    <!-- 侧边栏目录树 -->
    <div class="sidebar">
      <h3>📁 目录导航</h3>
      <div id="treeView"></div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 工具栏 -->
      <div class="toolbar">
        <div class="breadcrumb" id="breadcrumb">
          <a data-path="public/albums">相册根目录</a>
        </div>
        <button class="btn-primary" id="newFolderBtn">新建文件夹</button>
        <button class="btn-success" id="uploadBtn">上传文件</button>
      </div>

      <!-- 文件列表 -->
      <div class="file-list">
        <div class="file-grid" id="fileGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_CONFIG = 'album_global_config'
    let globalConfig = null
    let currentPath = 'public/albums'
    const API_BASE = 'https://api.github.com'

    // 1. 配置检测
    const configModal = document.getElementById('configModal')
    const saveConfig = document.getElementById('saveConfig')
    saveConfig.addEventListener('click', () => {
      const repo = document.getElementById('repoUrl').value.trim()
      const token = document.getElementById('githubToken').value.trim()
      if (!repo || !token) return alert('请填写完整信息')
      localStorage.setItem(STORAGE_CONFIG, JSON.stringify({ repoUrl: repo, githubToken: token }))
      location.reload()
    })

    function checkConfig() {
      globalConfig = JSON.parse(localStorage.getItem(STORAGE_CONFIG))
      if (!globalConfig) {
        configModal.classList.remove('hidden')
        return false
      }
      configModal.classList.add('hidden')
      return true
    }

    function parseRepo() {
      const url = globalConfig.repoUrl
      const arr = url.replace('https://github.com/', '').split('/')
      return { owner: arr[0], repo: arr[1] }
    }

    // 2. GitHub API
    async function githubApi(path, method = 'GET', body = null) {
      const { owner, repo } = parseRepo()
      const headers = {
        'Authorization': `token ${globalConfig.githubToken}`,
        'Accept': 'application/vnd.github.v3+json'
      }
      const res = await fetch(`${API_BASE}/repos/${owner}/${repo}/contents/${path}`, {
        method, headers, body: body ? JSON.stringify(body) : null
      })
      if (!res.ok) throw new Error('请求失败')
      return res.json()
    }

    // 3. 加载目录树
    async function loadTreeView(path = 'public/albums', parentEl = document.getElementById('treeView'), level = 0) {
      try {
        const items = await githubApi(path)
        const folders = items.filter(item => item.type === 'dir')
        for (const folder of folders) {
          const item = document.createElement('div')
          item.className = 'tree-item'
          item.style.paddingLeft = `${12 + level * 16}px`
          item.dataset.path = folder.path
          item.innerHTML = `<span class="tree-icon">📁</span> ${folder.name}`
          item.addEventListener('click', () => navigateTo(folder.path))
          parentEl.appendChild(item)
          // 递归加载子目录
          await loadTreeView(folder.path, parentEl, level + 1)
        }
      } catch (e) {
        console.error('加载目录树失败', e)
      }
    }

    // 4. 导航到指定目录
    async function navigateTo(path) {
      currentPath = path
      // 更新面包屑
      const parts = path.split('/')
      let breadcrumbHtml = ''
      let tempPath = ''
      for (let i = 0; i < parts.length; i++) {
        if (parts[i] === 'public' || parts[i] === 'albums') {
          tempPath += parts[i] + '/'
          continue
        }
        tempPath += parts[i] + '/'
        const fullPath = tempPath.slice(0, -1)
        breadcrumbHtml += `<a data-path="${fullPath}">${parts[i]}</a> / `
      }
      breadcrumbHtml = `<a data-path="public/albums">相册根目录</a> / ` + breadcrumbHtml.slice(0, -3)
      document.getElementById('breadcrumb').innerHTML = breadcrumbHtml
      // 绑定面包屑点击事件
      document.querySelectorAll('.breadcrumb a').forEach(link => {
        link.addEventListener('click', () => navigateTo(link.dataset.path))
      })
      // 加载文件列表
      await loadFileList(path)
    }

    // 5. 加载文件列表
    async function loadFileList(path) {
      const grid = document.getElementById('fileGrid')
      grid.innerHTML = ''
      try {
        const items = await githubApi(path)
        // 先显示文件夹，再显示文件
        const folders = items.filter(item => item.type === 'dir')
        const files = items.filter(item => item.type === 'file')
        // 渲染文件夹
        folders.forEach(folder => {
          const div = document.createElement('div')
          div.className = 'file-item'
          div.innerHTML = `
            <span class="file-icon folder">📁</span>
            <span class="file-name">${folder.name}</span>
            <span class="file-info">文件夹</span>
          `
          div.addEventListener('click', () => navigateTo(folder.path))
          grid.appendChild(div)
        })
        // 渲染文件
        files.forEach(file => {
          const div = document.createElement('div')
          div.className = 'file-item'
          const ext = file.name.split('.').pop().toLowerCase()
          const isImage = ['jpg', 'jpeg', 'png', 'webp'].includes(ext)
          const icon = isImage ? '🖼️' : '📄'
          div.innerHTML = `
            <span class="file-icon">${icon}</span>
            <span class="file-name">${file.name}</span>
            <span class="file-info">${(file.size / 1024).toFixed(1)} KB</span>
          `
          grid.appendChild(div)
        })
      } catch (e) {
        grid.innerHTML = '<p>加载失败，请检查权限</p>'
        console.error(e)
      }
    }

    // 6. 新建文件夹
    document.getElementById('newFolderBtn').addEventListener('click', async () => {
      const name = prompt('请输入文件夹名称（格式：YYYY-MM-dd-xxx）')
      if (!name || !/^\d{4}-\d{2}-\d{2}-.+$/.test(name)) {
        return alert('格式错误，需 YYYY-MM-dd-xxx')
      }
      const path = `${currentPath}/${name}/.gitkeep`
      await githubApi(path, 'PUT', { message: `新建文件夹 ${name}`, content: '' })
      alert('创建成功')
      navigateTo(currentPath)
    })

    // 7. 上传文件
    document.getElementById('uploadBtn').addEventListener('click', () => {
      const input = document.createElement('input')
      input.type = 'file'
      input.multiple = true
      input.accept = 'image/*'
      input.addEventListener('change', async (e) => {
        const files = e.target.files
        for (const file of files) {
          const reader = new FileReader()
          reader.readAsDataURL(file)
          reader.onload = async () => {
            const base64 = reader.result.split(',')[1]
            const path = `${currentPath}/${file.name}`
            await githubApi(path, 'PUT', { message: `上传 ${file.name}`, content: base64 })
          }
        }
        alert('上传请求已发送')
        setTimeout(() => navigateTo(currentPath), 1000)
      })
      input.click()
    })

    // 8. 删除文件/文件夹
    document.getElementById('fileGrid').addEventListener('dblclick', async (e) => {
      const item = e.target.closest('.file-item')
      if (!item) return
      const name = item.querySelector('.file-name').textContent
      const isFolder = item.querySelector('.file-info').textContent === '文件夹'
      if (!confirm(`确定删除 ${name}？`)) return
      const path = `${currentPath}/${name}`
      const list = await githubApi(currentPath)
      const target = list.find(i => i.name === name)
      await githubApi(path, 'DELETE', { sha: target.sha, message: `删除 ${name}` })
      navigateTo(currentPath)
    })

    // 初始化
    window.onload = async () => {
      if (checkConfig()) {
        await loadTreeView()
        await navigateTo('public/albums')
      }
    }
  </script>
</body>
</html>
