<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静态相册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; margin-bottom: 30px; color: #333; }
    .nav-bar { margin-bottom: 20px; text-align: center; }
    .nav-bar a { padding: 8px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; margin: 0 5px; }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .album-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .album-card:hover { transform: translateY(-4px); }
    .album-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .album-name {
      padding: 12px;
      text-align: center;
      color: #333;
      font-size: 14px;
    }

    /* 图片详情页样式 */
    .detail-wrap { display: none; max-width: 1200px; margin: 0 auto; }
    .detail-header { margin: 20px 0; }
    .back-btn {
      padding: 8px 16px;
      background: #666;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .img-container {
      text-align: center;
      margin: 20px 0;
    }
    .main-img {
      max-width: 90vw;
      max-height: 80vh;
      cursor: grab;
    }
    .main-img:active { cursor: grabbing; }
    .exif-panel, .link-panel {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin: 15px auto;
      max-width: 800px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .link-input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .copy-btn {
      padding: 6px 12px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .tip { color: #666; font-size: 13px; margin-top: 5px; }
  </style>
  <!-- 引入 EXIF 解析库 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.6.1/dist/piexif.min.js"></script>
</head>
<body>
  <h1>个人相册</h1>
  <div class="nav-bar">
    <a href="admin.html">进入管理后台</a>
  </div>

  <!-- 相册列表页 -->
  <div id="albumList" class="album-grid"></div>

  <!-- 图片详情页 -->
  <div id="photoDetail" class="detail-wrap">
    <div class="detail-header">
      <button class="back-btn" onclick="goBack()">← 返回相册</button>
    </div>
    <div class="img-container">
      <img id="mainImage" class="main-img" draggable="false">
    </div>
    <div class="link-panel">
      <h3>图片外链地址</h3>
      <input type="text" id="imgLink" class="link-input" readonly>
      <button class="copy-btn" onclick="copyLink()">一键复制</button>
      <p class="tip" id="copyTip"></p>
    </div>
    <div class="exif-panel">
      <h3>EXIF 拍摄信息</h3>
      <div id="exifInfo">加载中...</div>
    </div>
  </div>

  <script type="module">
    // 全局变量
    const ALBUM_BASE = '/albums/';
    const THUMB_W = 200;
    const THUMB_H = 150;
    let currentAlbum = '';
    let currentPhoto = '';

    // 1. 路由监听 Hash 切换
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', init);

    async function init() {
      handleRoute();
      await loadAlbumList();
    }

    // 路由分发：列表页 / 详情页
    function handleRoute() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const album = params.get('album');
      const photo = params.get('photo');

      const listDom = document.getElementById('albumList');
      const detailDom = document.getElementById('photoDetail');

      if (album && photo) {
        // 进入图片详情
        listDom.style.display = 'none';
        detailDom.style.display = 'block';
        currentAlbum = album;
        currentPhoto = photo;
        loadPhotoDetail(album, photo);
      } else {
        // 回到相册列表
        listDom.style.display = 'grid';
        detailDom.style.display = 'none';
      }
    }

    // 2. 扫描 albums 目录，筛选 YYYY-MM-dd- 格式相册
    async function loadAlbumList() {
      const albumListDom = document.getElementById('albumList');
      albumListDom.innerHTML = '<div>加载相册中...</div>';

      // Vite 全局扫描 public/albums 下所有子目录
      const albumFiles = import.meta.glob('/public/albums/*', { eager: false });
      const albumDirs = Object.keys(albumFiles)
        .map(path => {
          const dirName = path.replace('/public/albums/', '').replace('/', '');
          return dirName;
        })
        // 正则筛选：YYYY-MM-dd- 开头的文件夹
        .filter(name => /^\d{4}-\d{2}-\d{2}-/.test(name));

      albumListDom.innerHTML = '';

      // 遍历相册，生成卡片 + 缩略图
      for (const dir of albumDirs) {
        const albumName = dir.replace(/^\d{4}-\d{2}-\d{2}-/, '');
        const albumPath = `${ALBUM_BASE}${dir}/`;

        // 读取相册内图片
        const imgReg = /\.(jpg|jpeg|png|webp)$/i;
        const photoFiles = import.meta.glob(`/public/albums/${dir}/*`, { eager: false });
        const photos = Object.keys(photoFiles)
          .map(p => p.replace(`/public/albums/${dir}/`, ''))
          .filter(f => imgReg.test(f));

        if (photos.length === 0) continue;

        // 取第一张图生成缩略图
        const firstImgSrc = `${ALBUM_BASE}${dir}/${photos[0]}`;
        const thumbCanvas = await createThumbnail(firstImgSrc, THUMB_W, THUMB_H);

        // 构建相册卡片
        const card = document.createElement('div');
        card.className = 'album-card';
        card.onclick = () => window.location.hash = `album=${dir}&photo=${photos[0]}`;
        card.innerHTML = `
          <canvas class="album-thumb" width="${THUMB_W}" height="${THUMB_H}"></canvas>
          <div class="album-name">${albumName}</div>
        `;
        // 绘制缩略图到 canvas
        const canvas = card.querySelector('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(thumbCanvas, 0, 0, THUMB_W, THUMB_H);

        albumListDom.appendChild(card);
      }
    }

    // 3. Canvas 生成等比裁剪缩略图
    function createThumbnail(src, w, h) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');

          // 等比居中裁剪
          const scale = Math.max(w / img.width, h / img.height);
          const nw = img.width * scale;
          const nh = img.height * scale;
          const x = (w - nw) / 2;
          const y = (h - nh) / 2;

          ctx.drawImage(img, x, y, nw, nh);
          resolve(canvas);
        };
        img.src = src;
      });
    }

    // 4. 加载图片详情 + EXIF 解析
    async function loadPhotoDetail(album, photo) {
      const imgSrc = `${ALBUM_BASE}${album}/${photo}`;
      const mainImg = document.getElementById('mainImage');
      const linkInput = document.getElementById('imgLink');
      const exifDom = document.getElementById('exifInfo');

      mainImg.src = imgSrc;
      linkInput.value = location.origin + imgSrc;
      exifDom.innerHTML = '解析 EXIF 信息中...';

      // 解析 EXIF
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const exif = piexif.load(img.src);
        const ifd0 = exif['0th'] || {};
        const exifIfd = exif['Exif'] || {};
        const gps = exif['GPS'] || {};

        let html = '';
        // 拍摄时间
        if (exifIfd[piexif.ExifIFD.DateTimeOriginal]) {
          html += `<p>拍摄时间：${exifIfd[piexif.ExifIFD.DateTimeOriginal]}</p>`;
        }
        // 相机型号
        if (ifd0[piexif.ImageIFD.Model]) {
          html += `<p>相机型号：${ifd0[piexif.ImageIFD.Model]}</p>`;
        }
        // 曝光、光圈、ISO
        if (exifIfd[piexif.ExifIFD.ExposureTime]) {
          html += `<p>曝光时间：${piexif.helpers.exposureTime(exifIfd[piexif.ExifIFD.ExposureTime])}s</p>`;
        }
        if (exifIfd[piexif.ExifIFD.FNumber]) {
          html += `<p>光圈：f/${piexif.helpers.fnumber(exifIfd[piexif.ExifIFD.FNumber])}</p>`;
        }
        if (exifIfd[piexif.ExifIFD.ISOSpeedRatings]) {
          html += `<p>ISO：${exifIfd[piexif.ExifIFD.ISOSpeedRatings]}</p>`;
        }
        // GPS 坐标
        if (Object.keys(gps).length > 0) {
          const lat = piexif.helpers.gpsToDecimal(gps[piexif.GPSIFD.GPSLatitude], gps[piexif.GPSIFD.GPSLatitudeRef]);
          const lon = piexif.helpers.gpsToDecimal(gps[piexif.GPSIFD.GPSLongitude], gps[piexif.GPSIFD.GPSLongitudeRef]);
          html += `<p>GPS 坐标：纬度 ${lat}，经度 ${lon}</p>`;
        }

        exifDom.innerHTML = html || '<p>无 EXIF 信息</p>';
      };
      img.src = imgSrc;
    }

    // 5. 复制外链
    async function copyLink() {
      const input = document.getElementById('imgLink');
      const tip = document.getElementById('copyTip');
      try {
        await navigator.clipboard.writeText(input.value);
        tip.innerText = '复制成功！';
        setTimeout(() => tip.innerText = '', 2000);
      } catch (e) {
        tip.innerText = '复制失败，请手动复制';
      }
    }

    // 6. 返回列表页
    window.goBack = () => {
      window.location.hash = '';
    };
  </script>
</body>
</html>
