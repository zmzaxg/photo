<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的相册</title>
  <!-- Viewer.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/viewerjs@1.11.6/dist/viewer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/viewerjs@1.11.6/dist/viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap:12px; }
    .admin-link a { color: #2563eb; text-decoration: none; font-size: 14px; }
    .date-switch { font-size:14px; }
    h1 { color: #333; font-size:24px; }

    /* 返回栏：首页隐藏 */
    .back-row { margin-bottom:20px; display:none; }
    .back-btn {
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 相册网格 */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid-card {
      position: relative;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .grid-card:hover { transform: translateY(-4px); }
    .type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 2;
    }
    .card-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .card-name {
      padding: 12px;
      text-align: center;
      color: #444;
      font-size: 14px;
      word-break: break-all;
    }

    /* 详情页 */
    .detail-container { display: none; max-width: 1400px; margin: 0 auto; }
    .detail-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap:12px;
      flex-wrap: wrap;
    }
    .switch-group button {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size:14px;
      margin:0 4px;
    }
    .prev-btn { background:#60a5fa; color:#fff; }
    .next-btn { background:#60a5fa; color:#fff; }
    .open-viewer-btn { background:#10b981; color:#fff; }

    .main-img-box {
      position: relative;
      margin: 0 auto 20px;
      max-width: 90vw;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      cursor: zoom-in;
    }
    .main-preview-img { max-width: 90vw; display:block; }

    .info-panel {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info-item { margin: 8px 0; font-size: 14px; color: #333; }
    .link-box { display: flex; gap: 8px; margin-top: 16px; }
    .link-input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .copy-btn {
      padding: 8px 16px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .empty-tip {
      width:100%;
      text-align:center;
      padding:60px 20px;
      color:#777;
      font-size:16px;
    }
    /* Viewer专用隐藏容器 */
    .viewer-source-wrap { display:none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>我的相册</h1>
    <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
      <label class="date-switch">
        <input type="checkbox" id="homeToggleDate"> 显示文件夹日期前缀
      </label>
      <div class="admin-link">
        <a href="/admin.html">🔐 管理后台</a>
      </div>
    </div>
  </div>

  <div class="back-row" id="backRow">
    <button class="back-btn" id="backBtn">← 返回上一级</button>
  </div>

  <!-- 目录列表页 -->
  <div id="gridPage">
    <div class="item-grid" id="itemGrid"></div>
  </div>

  <!-- 大图详情页面 -->
  <div id="detailPage" class="detail-container">
    <div class="detail-top-bar">
      <div class="switch-group">
        <button class="prev-btn" id="prevImgBtn">上一张 ◀</button>
        <button class="next-btn" id="nextImgBtn">下一张 ▶</button>
        <button class="open-viewer-btn" id="openViewerBtn">全屏查看(Viewer)</button>
        <span style="font-size:13px;color:#666;margin-left:10px;">Viewer内左右切换不关闭弹窗，页面信息同步更新</span>
      </div>
    </div>
    <!-- 页面主预览图 -->
    <div class="main-img-box" id="mainImgBox">
      <img id="mainPreviewImg" class="main-preview-img" alt="预览图">
    </div>
    <div class="info-panel">
      <div class="info-item"><strong>图片链接：</strong></div>
      <div class="link-box">
        <input type="text" id="imgLink" class="link-input" readonly>
        <button class="copy-btn" id="copyLink">一键复制</button>
      </div>
      <div class="info-item"><strong>完整文件名：</strong><span id="detailFileName">暂无</span></div>
      <div class="info-item"><strong>EXIF 拍摄时间：</strong><span id="exifTime">暂无</span></div>
      <div class="info-item"><strong>相机型号：</strong><span id="exifCamera">暂无</span></div>
      <div class="info-item"><strong>曝光参数：</strong><span id="exifParam">暂无</span></div>
      <div class="info-item"><strong>GPS 坐标：</strong><span id="exifGps">暂无</span></div>
    </div>
  </div>

  <!-- Viewer 专用隐藏容器，存放当前目录全部图片DOM -->
  <div class="viewer-source-wrap" id="viewerSourceWrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/piexif@1.7.1/dist/piexif.min.js"></script>
  <script type="module">
    const ALBUM_BASE = '/albums/'
    const THUMB_SIZE = { w: 200, h: 150 }
    let showDate = false
    let currentDirPath = ''
    let currentPhotoIndex = 0
    let currentDirPhotoList = []
    let viewer = null
    // 标记Viewer是否处于打开状态
    let viewerIsOpen = false

    // DOM缓存
    const gridPage = document.getElementById('gridPage')
    const detailPage = document.getElementById('detailPage')
    const backRow = document.getElementById('backRow')
    const backBtn = document.getElementById('backBtn')
    const itemGrid = document.getElementById('itemGrid')
    const mainPreviewImg = document.getElementById('mainPreviewImg')
    const mainImgBox = document.getElementById('mainImgBox')
    const imgLink = document.getElementById('imgLink')
    const copyLink = document.getElementById('copyLink')
    const detailFileName = document.getElementById('detailFileName')
    const homeToggleDate = document.getElementById('homeToggleDate')
    const prevImgBtn = document.getElementById('prevImgBtn')
    const nextImgBtn = document.getElementById('nextImgBtn')
    const openViewerBtn = document.getElementById('openViewerBtn')
    const viewerSourceWrap = document.getElementById('viewerSourceWrap')

    let dirTree = new Map()
    const allImagePaths = Object.keys(import.meta.glob('/public/albums/**/*.{jpg,jpeg,png,webp}', { eager: false }))
    const FOLDER_DATE_REG = /^(\d{4}-\d{2}-\d{2})-(.+)$/

    function pureDirName(fullName) {
      const match = fullName.match(FOLDER_DATE_REG)
      return match ? match[2] : fullName
    }

    function getAssetUrl(dirPath, fileName) {
      const safeDir = dirPath ? dirPath + '/' : ''
      return ALBUM_BASE + safeDir + fileName
    }

    // 构建多级目录树
    function buildDirectoryTree() {
      dirTree.clear()
      dirTree.set('', { isDir: true, children: [], files: [] })
      for (const globPath of allImagePaths) {
        const relFull = globPath.replace('/public/albums/', '')
        const pathSegments = relFull.split('/')
        const fileName = pathSegments.pop()
        let tempPath = ''
        for (let segIdx = 0; segIdx < pathSegments.length; segIdx++) {
          const seg = pathSegments[segIdx]
          const parentPath = tempPath
          tempPath = tempPath ? tempPath + '/' + seg : seg
          if (!dirTree.has(tempPath)) {
            dirTree.set(tempPath, { isDir: true, children: [], files: [] })
            dirTree.get(parentPath).children.push(tempPath)
          }
        }
        dirTree.get(tempPath).files.push(fileName)
      }
    }

    function getDirCoverThumb(dirPath) {
      const node = dirTree.get(dirPath)
      if (!node) return null
      if (node.files.length > 0) return getAssetUrl(dirPath, node.files[0])
      for (const childDir of node.children) {
        const childThumb = getDirCoverThumb(childDir)
        if (childThumb) return childThumb
      }
      return null
    }

    function parseHash() {
      const hash = location.hash.slice(1)
      const params = new URLSearchParams(hash)
      return { dir: params.get('dir') || '', photo: params.get('photo') }
    }

    // 仅刷新页面下方图片信息，不修改hash、不销毁Viewer
    async function refreshPageInfoOnly(dir, fileName) {
      const url = getAssetUrl(dir, fileName)
      imgLink.value = location.origin + url
      detailFileName.innerText = fileName
      mainPreviewImg.src = url
      const exif = await parseExif(url)
      document.getElementById('exifTime').innerText = exif.takeTime
      document.getElementById('exifCamera').innerText = exif.camera
      document.getElementById('exifParam').innerText = exif.expStr
      document.getElementById('exifGps').innerText = exif.gpsStr
    }

    // 切换图片索引，区分Viewer打开/关闭两种状态
    function switchImageByIndex(newIndex) {
      if (currentDirPhotoList.length <= 1) return
      // 循环边界
      if (newIndex < 0) newIndex = currentDirPhotoList.length - 1
      if (newIndex >= currentDirPhotoList.length) newIndex = 0
      currentPhotoIndex = newIndex
      const targetFile = currentDirPhotoList[currentPhotoIndex]
      // 1. 强制刷新页面主图+EXIF信息（无刷新，不重载页面）
      refreshPageInfoOnly(currentDirPath, targetFile)
      // 2. 如果Viewer弹窗正在打开，直接在Viewer内切图，不销毁弹窗
      if (viewer && viewerIsOpen) {
        viewer.view(currentPhotoIndex)
      } else {
        // Viewer未打开才更新hash路由
        location.hash = `dir=${encodeURIComponent(currentDirPath)}&photo=${encodeURIComponent(targetFile)}`
      }
    }

    function goPrevImage() {
      switchImageByIndex(currentPhotoIndex - 1)
    }
    function goNextImage() {
      switchImageByIndex(currentPhotoIndex + 1)
    }

    // 初始化Viewer实例
    function initViewer() {
      // 复用已有实例，不重复销毁重建
      if (!viewer) {
        viewerSourceWrap.innerHTML = ''
        // 生成全部同级图片img DOM放入隐藏容器
        currentDirPhotoList.forEach((name) => {
          const img = document.createElement('img')
          img.src = getAssetUrl(currentDirPath, name)
          img.alt = name
          viewerSourceWrap.appendChild(img)
        })
        // 创建Viewer
        viewer = new Viewer(viewerSourceWrap, {
          inline: false,
          backdrop: true,
          navbar: true,
          title: true,
          toolbar: true,
          tooltip: true,
          movable: true,
          zoomable: true,
          rotatable: true,
          scalable: true,
          transition: true,
          fullscreen: true,
          keyboard: true,
          url: 'src',
          // 弹窗打开标记
          shown: () => {
            viewerIsOpen = true
          },
          // 弹窗关闭标记
          hidden: () => {
            viewerIsOpen = false
          },
          // Viewer内部切换图片：仅同步页面信息，不修改hash、不关闭弹窗
          view: (event) => {
            const newIdx = event.detail.index
            if (newIdx === currentPhotoIndex) return
            currentPhotoIndex = newIdx
            const targetName = currentDirPhotoList[newIdx]
            // 仅刷新页面信息，不更新hash，不会触发页面重载销毁Viewer
            refreshPageInfoOnly(currentDirPath, targetName)
          }
        })
      }
      // 直接打开到当前索引，全程不销毁实例
      viewer.view(currentPhotoIndex)
    }

    // 页面总切换逻辑（仅首次进入/切换相册时执行）
    function switchPage({ dir, photo }) {
      gridPage.style.display = 'none'
      detailPage.style.display = 'none'
      currentDirPath = dir
      backRow.style.display = dir || photo ? 'block' : 'none'
      // 切换相册/返回目录时销毁Viewer
      if (viewer) {
        viewer.destroy()
        viewer = null
        viewerIsOpen = false
      }
      if (photo) {
        detailPage.style.display = 'block'
        const node = dirTree.get(dir)
        currentDirPhotoList = node.files
        currentPhotoIndex = currentDirPhotoList.findIndex(n => n === photo)
        refreshPageInfoOnly(dir, photo)
      } else {
        gridPage.style.display = 'block'
        renderMixedItemGrid(dir)
      }
    }

    // 按钮绑定
    prevImgBtn.addEventListener('click', goPrevImage)
    nextImgBtn.addEventListener('click', goNextImage)
    openViewerBtn.addEventListener('click', initViewer)
    mainImgBox.addEventListener('click', initViewer)

    backBtn.addEventListener('click', () => {
      const { photo, dir } = parseHash()
      if (photo) {
        location.hash = dir ? `dir=${encodeURIComponent(dir)}` : ''
      } else {
        if (!dir) return
        const segList = dir.split('/')
        segList.pop()
        const parentDir = segList.join('/')
        location.hash = parentDir ? `dir=${encodeURIComponent(parentDir)}` : ''
      }
    })

    copyLink.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(imgLink.value)
        alert('复制成功')
      } catch {
        alert('复制失败，请手动复制')
      }
    })

    // 生成缩略图Canvas
    function createThumbnail(imgSrc, callback) {
      const img = new Image()
      img.crossOrigin = 'anonymous'
      img.onload = () => {
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')
        canvas.width = THUMB_SIZE.w
        canvas.height = THUMB_SIZE.h
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height)
        const drawW = img.width * scale, drawH = img.height * scale
        const x = (canvas.width - drawW) / 2, y = (canvas.height - drawH) / 2
        ctx.drawImage(img, x, y, drawW, drawH)
        callback(canvas.toDataURL('image/jpeg', 0.8))
      }
      img.onerror = () => {
        const svg = `<svg width="${THUMB_SIZE.w}" height="${THUMB_SIZE.h}"><rect fill="#eee" width="100%" height="100%"/><text x="50%" y="50%" fill="#999" text-anchor="middle">无预览图</text></svg>`
        callback(`data:image/svg+xml;utf8,${svg}`)
      }
      img.src = imgSrc
    }

    // EXIF解析
    function parseExif(imgUrl) {
      return new Promise(resolve => {
        const img = new Image()
        img.crossOrigin = 'anonymous'
        img.onload = () => {
          const exif = piexif.load(img.src)
          const ifd0 = exif['0th'] || {}
          const exifInfo = exif.Exif || {}
          const gps = exif.GPS || {}
          const takeTime = exifInfo[piexif.ExifIFD.DateTimeOriginal] || '暂无'
          const camera = ifd0[piexif.ImageIFD.Model] || '暂无'
          let exp = []
          if (exifInfo[piexif.ExifIFD.FNumber]) {
            const f = piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.FNumber])
            exp.push(`光圈 f/${f}`)
          }
          if (exifInfo[piexif.ExifIFD.ExposureTime]) {
            const s = piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.ExposureTime])
            exp.push(`快门 1/${Math.round(1 / s)}s`)
          }
          const expStr = exp.join(' ') || '暂无'
          let gpsStr = '暂无'
          if (gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
            const lat = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLatitude])
            const lon = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLongitude])
            gpsStr = `纬度:${lat.toFixed(6)} 经度:${lon.toFixed(6)}`
          }
          resolve({ takeTime, camera, expStr, gpsStr })
        }
        img.src = imgUrl
      })
    }

    // 渲染混合目录卡片（文件夹+图片）
    function renderMixedItemGrid(dirPath) {
      itemGrid.innerHTML = ''
      const node = dirTree.get(dirPath)
      const childDirList = node.children
      const photoFileList = node.files
      if (childDirList.length === 0 && photoFileList.length === 0) {
        itemGrid.innerHTML = '<div class="empty-tip">当前目录无相册文件夹、无图片文件</div>'
        return
      }
      // 渲染相册文件夹卡片
      for (const childFullDir of childDirList) {
        const segArr = childFullDir.split('/')
        const dirShortName = segArr[segArr.length - 1]
        const displayName = showDate ? dirShortName : pureDirName(dirShortName)
        const coverImg = getDirCoverThumb(childFullDir)
        const card = document.createElement('div')
        card.className = 'grid-card'
        createThumbnail(coverImg, thumbData => {
          card.innerHTML = `
            <span class="type-badge">📁 相册</span>
            <img class="card-thumb" src="${thumbData}">
            <div class="card-name">${displayName}</div>
          `
        })
        card.addEventListener('click', () => {
          location.hash = `dir=${encodeURIComponent(childFullDir)}`
        })
        itemGrid.appendChild(card)
      }
      // 渲染图片卡片
      for (const fileName of photoFileList) {
        const imgSrc = getAssetUrl(dirPath, fileName)
        const card = document.createElement('div')
        card.className = 'grid-card'
        createThumbnail(imgSrc, thumbData => {
          card.innerHTML = `
            <span class="type-badge">🖼️ 图片</span>
            <img class="card-thumb" src="${thumbData}">
            <div class="card-name">${fileName}</div>
          `
        })
        card.addEventListener('click', () => {
          location.hash = `dir=${encodeURIComponent(dirPath)}&photo=${encodeURIComponent(fileName)}`
        })
        itemGrid.appendChild(card)
      }
    }

    // 切换日期显示开关
    homeToggleDate.addEventListener('change', e => {
      showDate = e.target.checked
      switchPage(parseHash())
    })

    // 路由监听（仅hash真正变化时刷新页面，Viewer打开时内部切换不会触发hash变更）
    window.addEventListener('hashchange', () => {
      // 如果Viewer弹窗打开，忽略hash变更，不重载页面
      if (viewerIsOpen) return
      switchPage(parseHash())
    })

    // 页面初始化
    window.onload = () => {
      showDate = homeToggleDate.checked
      buildDirectoryTree()
      switchPage(parseHash())
    }
  </script>
</body>
</html>
