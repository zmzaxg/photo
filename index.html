<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的相册</title>
  <!-- 全局强制禁止所有缓存，浏览器/代理均不缓存页面本体 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .admin-link a { color: #2563eb; text-decoration: none; font-size: 14px; }
    .date-switch { font-size:14px; }
    h1 { color: #333; }

    .album-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .album-item {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .album-item:hover { transform: translateY(-4px); }
    .album-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .album-name {
      padding: 12px;
      text-align: center;
      color: #444;
      font-size: 14px;
    }

    .detail-container { display: none; max-width: 1400px; margin: 0 auto; }
    .back-btn {
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .img-wrapper {
      position: relative;
      margin: 0 auto 20px;
      max-width: 90vw;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .preview-img { max-width: 90vw; cursor: grab; }
    .preview-img:active { cursor: grabbing; }

    .info-panel {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info-item { margin: 8px 0; font-size: 14px; color: #333; }
    .link-box { display: flex; gap: 8px; margin-top: 16px; }
    .link-input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .copy-btn {
      padding: 8px 16px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <!-- 第三方库增加防缓存时间戳，每次刷新重新加载piexif -->
  <script src="https://cdn.jsdelivr.net/npm/piexif@1.7.1/dist/piexif.min.js?_t=<%= Date.now() %>"></script>
</head>
<body>
  <div class="header">
    <h1>我的相册</h1>
    <div style="display:flex; gap:20px; align-items:center;">
      <label class="date-switch">
        <input type="checkbox" id="homeToggleDate"> 显示文件夹日期前缀
      </label>
      <div class="admin-link">
        <a href="/admin.html?_t=<%= Date.now() %>">🔐 管理后台</a>
      </div>
    </div>
  </div>

  <div id="albumPage">
    <div class="album-list" id="albumList"></div>
  </div>

  <div id="detailPage" class="detail-container">
    <button class="back-btn" id="backBtn">← 返回相册列表</button>
    <div class="img-wrapper">
      <img id="previewImg" class="preview-img" alt="预览图">
    </div>
    <div class="info-panel">
      <div class="info-item"><strong>图片链接：</strong></div>
      <div class="link-box">
        <input type="text" id="imgLink" class="link-input" readonly>
        <button class="copy-btn" id="copyLink">一键复制</button>
      </div>
      <div class="info-item"><strong>EXIF 拍摄时间：</strong><span id="exifTime">暂无</span></div>
      <div class="info-item"><strong>相机型号：</strong><span id="exifCamera">暂无</span></div>
      <div class="info-item"><strong>曝光参数：</strong><span id="exifParam">暂无</span></div>
      <div class="info-item"><strong>GPS 坐标：</strong><span id="exifGps">暂无</span></div>
    </div>
  </div>

  <script type="module">
    // 基础常量
    const ALBUM_BASE = '/albums/'
    const THUMB_SIZE = { w: 200, h: 150 }
    // DOM 缓存只取一次元素引用，不缓存业务数据
    const dom = {
      albumPage: document.getElementById('albumPage'),
      detailPage: document.getElementById('detailPage'),
      albumList: document.getElementById('albumList'),
      backBtn: document.getElementById('backBtn'),
      previewImg: document.getElementById('previewImg'),
      imgLink: document.getElementById('imgLink'),
      copyLink: document.getElementById('copyLink'),
      homeToggleDate: document.getElementById('homeToggleDate'),
      exifTime: document.getElementById('exifTime'),
      exifCamera: document.getElementById('exifCamera'),
      exifParam: document.getElementById('exifParam'),
      exifGps: document.getElementById('exifGps')
    }

    // 清除全部旧业务缓存、状态、图片实例
    function clearAllRuntimeCache() {
      // 清空相册映射缓存
      window.__albumMapCache = null
      // 销毁图片实例、解绑拖拽监听
      dom.previewImg.src = ''
      dom.previewImg.style.transform = ''
      // 清空EXIF面板
      dom.exifTime.textContent = '暂无'
      dom.exifCamera.textContent = '暂无'
      dom.exifParam.textContent = '暂无'
      dom.exifGps.textContent = '暂无'
      dom.imgLink.value = ''
      // 清空相册列表DOM
      dom.albumList.innerHTML = ''
      // 销毁全局拖拽状态变量
      window.__dragState = null
    }

    // 文件夹名称剥离日期前缀
    function pureName(fullName) {
      const reg = /^\d{4}-\d{2}-\d{2}-/
      return reg.test(fullName) ? fullName.replace(reg, '') : fullName
    }

    // 解析路由哈希（每次全新解析，不缓存路由参数）
    function parseHash() {
      const hash = location.hash.slice(1)
      const params = new URLSearchParams(hash)
      return {
        album: params.get('album'),
        photo: params.get('photo')
      }
    }

    // 页面切换，每次切换完整重置缓存
    function switchPage() {
      clearAllRuntimeCache()
      const route = parseHash()
      if (route.album && route.photo) {
        dom.albumPage.style.display = 'none'
        dom.detailPage.style.display = 'block'
        loadPhotoDetail(route.album, route.photo)
      } else {
        dom.albumPage.style.display = 'block'
        dom.detailPage.style.display = 'none'
      }
    }

    // 返回按钮：清空缓存再回列表
    dom.backBtn.addEventListener('click', () => {
      clearAllRuntimeCache()
      location.hash = ''
    })

    // 复制链接
    dom.copyLink.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(dom.imgLink.value)
        alert('复制成功')
      } catch {
        alert('手动复制')
      }
    })

    // 生成缩略图：每次全新Image+Canvas，加防缓存戳，无任何缓存复用
    function createThumbnail(imgRawSrc, callback) {
      const timeStamp = Date.now()
      const imgSrc = `${imgRawSrc}?_t=${timeStamp}`
      const img = new Image()
      img.crossOrigin = 'anonymous'
      img.referrerPolicy = 'no-referrer'
      img.onload = () => {
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')
        canvas.width = THUMB_SIZE.w
        canvas.height = THUMB_SIZE.h
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height)
        const w = img.width * scale, h = img.height * scale
        const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2
        ctx.drawImage(img, x, y, w, h)
        // 立即销毁图片释放内存
        img.src = ''
        callback(canvas.toDataURL('image/jpeg', 0.8))
      }
      img.onerror = () => callback('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150"><rect width="200" height="150" fill="#eee"/><text x="100" y="75" text-anchor="middle" fill="#999">加载失败</text></svg>')
      img.src = imgSrc
    }

    // EXIF解析：每次新建Image，带防缓存戳，不缓存EXIF结果
    function parseExif(imgRawUrl) {
      return new Promise((resolve) => {
        const ts = Date.now()
        const imgUrl = `${imgRawUrl}?_t=${ts}`
        const img = new Image()
        img.crossOrigin = 'anonymous'
        img.referrerPolicy = 'no-referrer'
        img.onload = () => {
          try {
            const exif = piexif.load(img.src)
            const ifd0 = exif['0th'] || {}
            const exifInfo = exif.Exif || {}
            const gps = exif.GPS || {}
            const takeTime = exifInfo[piexif.ExifIFD.DateTimeOriginal] || '暂无'
            const camera = ifd0[piexif.ImageIFD.Model] || '暂无'
            let exp = []
            if (exifInfo[piexif.ExifIFD.FNumber]) exp.push(`光圈 f/${piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.FNumber])}`)
            if (exifInfo[piexif.ExifIFD.ExposureTime]) exp.push(`快门 1/${Math.round(1 / piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.ExposureTime]))}s`)
            const expStr = exp.join(' ') || '暂无'
            let gpsStr = '暂无'
            if (gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
              const lat = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLatitude])
              const lon = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLongitude])
              gpsStr = `纬度:${lat.toFixed(6)} 经度:${lon.toFixed(6)}`
            }
            // 释放图片内存
            img.src = ''
            resolve({ takeTime, camera, expStr, gpsStr })
          } catch (err) {
            img.src = ''
            resolve({ takeTime: '无EXIF', camera: '无EXIF', expStr: '无EXIF', gpsStr: '无EXIF' })
          }
        }
        img.onerror = () => resolve({ takeTime: '读取失败', camera: '读取失败', expStr: '读取失败', gpsStr: '读取失败' })
        img.src = imgUrl
      })
    }

    // 图片拖拽缩放：每次加载详情完全重置状态，解绑旧监听
    function initDragZoom() {
      // 销毁旧拖拽监听
      dom.previewImg.onwheel = null
      dom.previewImg.onmousedown = null
      document.onmousemove = null
      document.onmouseup = null
      // 全新状态对象存入临时变量，不全局缓存
      const dragState = {
        scale: 1,
        isDrag: false,
        moveX: 0,
        moveY: 0,
        startX: 0,
        startY: 0
      }
      dom.previewImg.style.transform = `scale(${dragState.scale}) translate(0,0)`

      dom.previewImg.addEventListener('wheel', (e) => {
        e.preventDefault()
        dragState.scale += e.deltaY > 0 ? -0.1 : 0.1
        dragState.scale = Math.max(0.5, Math.min(dragState.scale, 3))
        dom.previewImg.style.transform = `scale(${dragState.scale}) translate(${dragState.moveX}px, ${dragState.moveY}px)`
      }, { passive: false })

      dom.previewImg.addEventListener('mousedown', (e) => {
        dragState.isDrag = true
        dragState.startX = e.clientX - dragState.moveX
        dragState.startY = e.clientY - dragState.moveY

        function onMove(e) {
          if (!dragState.isDrag) return
          dragState.moveX = e.clientX - dragState.startX
          dragState.moveY = e.clientY - dragState.startY
          dom.previewImg.style.transform = `scale(${dragState.scale}) translate(${dragState.moveX}px, ${dragState.moveY}px)`
        }
        function onUp() {
          dragState.isDrag = false
          document.removeEventListener('mousemove', onMove)
          document.removeEventListener('mouseup', onUp)
        }
        document.addEventListener('mousemove', onMove)
        document.addEventListener('mouseup', onUp)
      })
    }

    // 加载图片详情：全部带防缓存戳，每次全新请求
    async function loadPhotoDetail(albumName, photoName) {
      clearAllRuntimeCache()
      const ts = Date.now()
      const rawUrl = `${ALBUM_BASE}${albumName}/${photoName}`
      const fullUrl = `${rawUrl}?_t=${ts}`
      // 原始无戳链接给复制框，预览图带戳防缓存
      dom.imgLink.value = location.origin + rawUrl
      dom.previewImg.src = fullUrl
      initDragZoom()
      // 每次重新解析EXIF，不缓存上次结果
      const exifData = await parseExif(rawUrl)
      dom.exifTime.innerText = exifData.takeTime
      dom.exifCamera.innerText = exifData.camera
      dom.exifParam.innerText = exifData.expStr
      dom.exifGps.innerText = exifData.gpsStr
    }

    // 扫描相册文件：每次调用强制重新导入glob，不缓存文件列表
    async function scanAlbums() {
      clearAllRuntimeCache()
      // 每次全新glob导入，不缓存模块映射
      const imageModules = import.meta.glob('/public/albums/**/*.{jpg,jpeg,png,webp}', { eager: false, import: 'default' })
      const albumMap = new Map()
      const regAlbum = /^(\d{4}-\d{2}-\d{2})-(.+)$/
      for (const path in imageModules) {
        const pathArr = path.replace('/public/albums/', '').split('/')
        const folderName = pathArr[0]
        const fileName = pathArr[1]
        const match = folderName.match(regAlbum)
        if (!match) continue
        const [_, date, name] = match
        if (!albumMap.has(folderName)) albumMap.set(folderName, { date, name, files: [] })
        albumMap.get(folderName).files.push(fileName)
      }
      // 存入临时变量，渲染完成自动丢弃
      window.__albumMapCache = albumMap
      await renderAlbumList(albumMap)
    }

    // 渲染相册列表：每次全删DOM，新建所有item，不复用旧节点
    async function renderAlbumList(map) {
      dom.albumList.innerHTML = ''
      const showDate = dom.homeToggleDate.checked
      // 顺序遍历，逐个创建全新DOM节点
      for (const [folderName, info] of map) {
        const firstImgRaw = `${ALBUM_BASE}${folderName}/${info.files[0]}`
        const item = document.createElement('div')
        item.className = 'album-item'
        const displayName = showDate ? folderName : pureName(folderName)
        // 生成缩略图，每次全新请求
        createThumbnail(firstImgRaw, (thumbSrc) => {
          item.innerHTML = `<img class="album-thumb" src="${thumbSrc}" loading="eager"><div class="album-name">${displayName}</div>`
        })
        // 全新点击事件，无缓存闭包
        item.addEventListener('click', () => {
          clearAllRuntimeCache()
          location.hash = `album=${folderName}&photo=${info.files[0]}`
        })
        dom.albumList.appendChild(item)
      }
    }

    // 日期切换：清空缓存后完整重扫重绘
    dom.homeToggleDate.addEventListener('change', async () => {
      clearAllRuntimeCache()
      await scanAlbums()
      switchPage()
    })

    // 哈希路由变化：强制清空所有缓存再刷新页面
    window.addEventListener('hashchange', async () => {
      clearAllRuntimeCache()
      await scanAlbums()
      switchPage()
    })

    // 页面首次加载：全局缓存清零，完整动态加载全部资源
    window.addEventListener('load', async () => {
      clearAllRuntimeCache()
      await scanAlbums()
      switchPage()
    })

    // 浏览器前进/后退强制清除缓存刷新
    window.addEventListener('popstate', async () => {
      clearAllRuntimeCache()
      await scanAlbums()
      switchPage()
    })

    // 页面隐藏/切回时重新全量加载，杜绝内存缓存
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        clearAllRuntimeCache()
        await scanAlbums()
        switchPage()
      }
    })
  </script>
</body>
</html>
