<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的相册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap:12px; }
    .admin-link a { color: #2563eb; text-decoration: none; font-size: 14px; }
    .date-switch { font-size:14px; }
    h1 { color: #333; font-size:24px; }

    .back-row { margin-bottom:20px; display:none; }
    .back-btn {
      padding: 8px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 首页/子目录 文件夹列表通用样式 */
    .album-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .album-item {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .album-item:hover { transform: translateY(-4px); }
    .album-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .album-name {
      padding: 12px;
      text-align: center;
      color: #444;
      font-size: 14px;
    }

    /* 相册内图片缩略图列表 */
    .photo-grid-page { display: none; max-width:1400px; margin:0 auto; }
    .photo-grid-title { margin-bottom:20px; font-size:18px; color:#333; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap:16px;
    }
    .photo-card {
      background:#fff;
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      cursor:pointer;
      transition:transform 0.2s;
    }
    .photo-card:hover { transform: translateY(-3px); }
    .photo-card-thumb {
      width:100%;
      height:120px;
      object-fit:cover;
      display:block;
    }
    .photo-fullname {
      padding:8px;
      font-size:12px;
      color:#555;
      text-align:center;
      word-break:break-all;
    }

    /* 单图详情页 */
    .detail-container { display: none; max-width: 1400px; margin: 0 auto; }
    .img-wrapper {
      position: relative;
      margin: 0 auto 20px;
      max-width: 90vw;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .preview-img { max-width: 90vw; cursor: grab; }
    .preview-img:active { cursor: grabbing; }

    .info-panel {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .info-item { margin: 8px 0; font-size: 14px; color: #333; }
    .link-box { display: flex; gap: 8px; margin-top: 16px; }
    .link-input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .copy-btn {
      padding: 8px 16px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .empty-tip {
      width:100%;
      text-align:center;
      padding:60px 20px;
      color:#777;
      font-size:16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>我的相册</h1>
    <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
      <label class="date-switch">
        <input type="checkbox" id="homeToggleDate"> 显示文件夹日期前缀
      </label>
      <div class="admin-link">
        <a href="/admin.html">🔐 管理后台</a>
      </div>
    </div>
  </div>

  <!-- 返回按钮通用 -->
  <div class="back-row" id="backRow">
    <button class="back-btn" id="backBtn">← 返回上一级</button>
  </div>

  <!-- 文件夹列表页（根目录/任意层级子目录） -->
  <div id="folderListPage">
    <div class="album-list" id="folderList"></div>
  </div>

  <!-- 当前目录下图片缩略图列表 -->
  <div id="photoGridPage" class="photo-grid-page">
    <div class="photo-grid-title" id="photoGridTitle"></div>
    <div class="photo-grid" id="photoGrid"></div>
  </div>

  <!-- 第三层：单张图片详情大图预览 -->
  <div id="detailPage" class="detail-container">
    <div class="img-wrapper">
      <img id="previewImg" class="preview-img" alt="预览图">
    </div>
    <div class="info-panel">
      <div class="info-item"><strong>图片链接：</strong></div>
      <div class="link-box">
        <input type="text" id="imgLink" class="link-input" readonly>
        <button class="copy-btn" id="copyLink">一键复制</button>
      </div>
      <div class="info-item"><strong>完整文件名：</strong><span id="detailFileName">暂无</span></div>
      <div class="info-item"><strong>EXIF 拍摄时间：</strong><span id="exifTime">暂无</span></div>
      <div class="info-item"><strong>相机型号：</strong><span id="exifCamera">暂无</span></div>
      <div class="info-item"><strong>曝光参数：</strong><span id="exifParam">暂无</span></div>
      <div class="info-item"><strong>GPS 坐标：</strong><span id="exifGps">暂无</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/piexif@1.7.1/dist/piexif.min.js"></script>
  <script type="module">
    const ALBUM_BASE = '/albums/'
    const THUMB_SIZE = { w: 200, h: 150 }
    let showDate = false
    let currentDirPath = '' // 当前浏览的完整目录路径，多级存储

    // DOM节点缓存
    const folderListPage = document.getElementById('folderListPage')
    const photoGridPage = document.getElementById('photoGridPage')
    const detailPage = document.getElementById('detailPage')
    const backRow = document.getElementById('backRow')
    const backBtn = document.getElementById('backBtn')
    const folderList = document.getElementById('folderList')
    const photoGrid = document.getElementById('photoGrid')
    const photoGridTitle = document.getElementById('photoGridTitle')
    const previewImg = document.getElementById('previewImg')
    const imgLink = document.getElementById('imgLink')
    const copyLink = document.getElementById('copyLink')
    const detailFileName = document.getElementById('detailFileName')
    const homeToggleDate = document.getElementById('homeToggleDate')

    // 全局目录树缓存：{ 完整路径: { isDir:布尔, children:[子路径], files:[图片名] } }
    let dirTree = new Map()
    // 顶层预加载全部图片路径（递归匹配多级目录）
    const allImagePaths = Object.keys(import.meta.glob('/public/albums/**/*.{jpg,jpeg,png,webp}', { eager: false }))
    const FOLDER_DATE_REG = /^(\d{4}-\d{2}-\d{2})-(.+)$/

    // 工具：去除日期前缀，获取纯文件夹名
    function pureDirName(fullName) {
      const match = fullName.match(FOLDER_DATE_REG)
      return match ? match[2] : fullName
    }

    // 工具：拼接完整访问URL
    function getAssetUrl(dirPath, fileName) {
      const safeDir = dirPath ? dirPath + '/' : ''
      return ALBUM_BASE + safeDir + fileName
    }

    // 构建完整多级目录树（递归解析所有图片路径）
    function buildDirectoryTree() {
      dirTree.clear()
      // 初始化根目录
      dirTree.set('', { isDir: true, children: [], files: [] })

      for (const globPath of allImagePaths) {
        // 剥离 /public/albums/ 前缀，得到相对根目录的分层路径
        const relFull = globPath.replace('/public/albums/', '')
        const pathSegments = relFull.split('/')
        const fileName = pathSegments.pop() // 最后一段是图片文件名
        let tempPath = ''

        // 逐层创建目录节点
        for (let segIdx = 0; segIdx < pathSegments.length; segIdx++) {
          const seg = pathSegments[segIdx]
          const parentPath = tempPath
          tempPath = tempPath ? tempPath + '/' + seg : seg

          // 当前目录不存在则新建
          if (!dirTree.has(tempPath)) {
            dirTree.set(tempPath, { isDir: true, children: [], files: [] })
            // 父目录添加子目录记录
            dirTree.get(parentPath).children.push(tempPath)
          }
        }
        // 将图片归入最终目录的files数组
        dirTree.get(tempPath).files.push(fileName)
      }
      console.log('多级目录树构建完成', dirTree)
    }

    // 工具：获取当前目录下「第一张可用缩略图URL」（仅本级，不越级子目录）
    function getDirFirstThumb(dirPath) {
      const node = dirTree.get(dirPath)
      if (!node) return null
      // 优先取当前目录内图片第一张
      if (node.files.length > 0) {
        return getAssetUrl(dirPath, node.files[0])
      }
      // 当前目录无图片，取第一个子目录内第一张图
      for (const childDir of node.children) {
        const childThumb = getDirFirstThumb(childDir)
        if (childThumb) return childThumb
      }
      return null
    }

    // 解析哈希路由，支持多级目录路径编码
    function parseHash() {
      const hash = location.hash.slice(1)
      const params = new URLSearchParams(hash)
      return {
        dir: params.get('dir') || '', // 多级目录完整路径，空=根目录
        photo: params.get('photo')    // 有值则打开大图详情
      }
    }

    // 页面总切换逻辑：区分目录列表/图片列表/大图详情
    function switchPage({ dir, photo }) {
      // 全部页面隐藏、返回按钮默认隐藏
      folderListPage.style.display = 'none'
      photoGridPage.style.display = 'none'
      detailPage.style.display = 'none'
      backRow.style.display = 'none'
      currentDirPath = dir

      if (photo) {
        // 层级3：单图详情
        backRow.style.display = 'block'
        detailPage.style.display = 'block'
        loadPhotoDetail(dir, photo)
      } else {
        const dirNode = dirTree.get(dir)
        if (!dirNode) return
        if (dirNode.files.length > 0) {
          // 层级2：当前目录存在图片，渲染图片网格
          backRow.style.display = !!dir
          photoGridPage.style.display = 'block'
          renderPhotoGrid(dir)
        } else {
          // 层级1：仅存在子文件夹，渲染目录列表
          folderListPage.style.display = 'block'
          renderFolderList(dir)
        }
      }
    }

    // 返回上一级目录逻辑
    backBtn.addEventListener('click', () => {
      const { photo, dir } = parseHash()
      if (photo) {
        // 从大图返回当前目录页面
        location.hash = dir ? `dir=${encodeURIComponent(dir)}` : ''
      } else {
        // 从子目录返回父级目录
        if (!dir) return
        const segList = dir.split('/')
        segList.pop()
        const parentDir = segList.join('/')
        location.hash = parentDir ? `dir=${encodeURIComponent(parentDir)}` : ''
      }
    })

    // 复制图片链接
    copyLink.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(imgLink.value)
        alert('复制成功')
      } catch (err) {
        alert('复制失败，请手动复制输入框内链接')
      }
    })

    // Canvas生成统一200*150缩略图
    function createThumbnail(imgSrc, callback) {
      const img = new Image()
      img.crossOrigin = 'anonymous'
      img.onload = () => {
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')
        canvas.width = THUMB_SIZE.w
        canvas.height = THUMB_SIZE.h
        const scale = Math.max(canvas.width / img.width, canvas.height / img.height)
        const drawW = img.width * scale, drawH = img.height * scale
        const x = (canvas.width - drawW) / 2, y = (canvas.height - drawH) / 2
        ctx.drawImage(img, x, y, drawW, drawH)
        callback(canvas.toDataURL('image/jpeg', 0.8))
      }
      // 兜底占位图
      img.onerror = () => {
        const svg = `<svg width="${THUMB_SIZE.w}" height="${THUMB_SIZE.h}"><rect fill="#eee" width="100%" height="100%"/><text x="50%" y="50%" fill="#999" text-anchor="middle">无预览图</text></svg>`
        callback(`data:image/svg+xml;utf8,${svg}`)
      }
      img.src = imgSrc
    }

    // 解析图片EXIF信息
    function parseExif(imgUrl) {
      return new Promise(resolve => {
        const img = new Image()
        img.crossOrigin = 'anonymous'
        img.onload = () => {
          const exif = piexif.load(img.src)
          const ifd0 = exif['0th'] || {}
          const exifInfo = exif.Exif || {}
          const gps = exif.GPS || {}
          const takeTime = exifInfo[piexif.ExifIFD.DateTimeOriginal] || '暂无'
          const camera = ifd0[piexif.ImageIFD.Model] || '暂无'
          let exp = []
          if (exifInfo[piexif.ExifIFD.FNumber]) {
            const f = piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.FNumber])
            exp.push(`光圈 f/${f}`)
          }
          if (exifInfo[piexif.ExifIFD.ExposureTime]) {
            const s = piexif.GPSHelper.dmsToDeg(exifInfo[piexif.ExifIFD.ExposureTime])
            exp.push(`快门 1/${Math.round(1 / s)}s`)
          }
          const expStr = exp.join(' ') || '暂无'
          let gpsStr = '暂无'
          if (gps[piexif.GPSIFD.GPSLatitude] && gps[piexif.GPSIFD.GPSLongitude]) {
            const lat = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLatitude])
            const lon = piexif.GPSHelper.dmsToDeg(gps[piexif.GPSIFD.GPSLongitude])
            gpsStr = `纬度:${lat.toFixed(6)} 经度:${lon.toFixed(6)}`
          }
          resolve({ takeTime, camera, expStr, gpsStr })
        }
        img.src = imgUrl
      })
    }

    // 大图拖拽缩放重置
    let scale = 1, isDrag = false, moveX = 0, moveY = 0
    function initDragZoom() {
      scale = 1; moveX = 0; moveY = 0
      previewImg.style.transform = `scale(${scale}) translate(0,0)`
      previewImg.onwheel = e => {
        e.preventDefault()
        scale += e.deltaY > 0 ? -0.1 : 0.1
        scale = Math.max(0.5, Math.min(scale, 3))
        previewImg.style.transform = `scale(${scale}) translate(${moveX}px, ${moveY}px)`
      }
      previewImg.onmousedown = e => {
        isDrag = true
        const startX = e.clientX - moveX
        const startY = e.clientY - moveY
        document.onmousemove = ev => {
          if (!isDrag) return
          moveX = ev.clientX - startX
          moveY = ev.clientY - startY
          previewImg.style.transform = `scale(${scale}) translate(${moveX}px, ${moveY}px)`
        }
        document.onmouseup = () => isDrag = false
      }
    }

    // 加载单张大图详情
    async function loadPhotoDetail(dirPath, photoName) {
      const fullAssetUrl = getAssetUrl(dirPath, photoName)
      imgLink.value = location.origin + fullAssetUrl
      detailFileName.innerText = photoName
      previewImg.src = fullAssetUrl
      initDragZoom()
      const exifData = await parseExif(fullAssetUrl)
      document.getElementById('exifTime').innerText = exifData.takeTime
      document.getElementById('exifCamera').innerText = exifData.camera
      document.getElementById('exifParam').innerText = exifData.expStr
      document.getElementById('exifGps').innerText = exifData.gpsStr
    }

    // 渲染当前目录的子文件夹列表（多级目录页）
    function renderFolderList(dirPath) {
      folderList.innerHTML = ''
      const node = dirTree.get(dirPath)
      const childDirs = node.children
      if (childDirs.length === 0) {
        folderList.innerHTML = '<div class="empty-tip">当前目录无任何子相册文件夹</div>'
        return
      }
      for (const childFullPath of childDirs) {
        // 提取当前层级文件夹名称
        const segArr = childFullPath.split('/')
        const dirShortName = segArr[segArr.length - 1]
        const displayName = showDate ? dirShortName : pureDirName(dirShortName)
        const thumbUrl = getDirFirstThumb(childFullPath)

        const item = document.createElement('div')
        item.className = 'album-item'
        createThumbnail(thumbUrl, thumbData => {
          item.innerHTML = `<img class="album-thumb" src="${thumbData}"><div class="album-name">${displayName}</div>`
        })
        // 点击进入子目录
        item.addEventListener('click', () => {
          location.hash = `dir=${encodeURIComponent(childFullPath)}`
        })
        folderList.appendChild(item)
      }
    }

    // 渲染当前目录下所有图片网格
    function renderPhotoGrid(dirPath) {
      photoGrid.innerHTML = ''
      const node = dirTree.get(dirPath)
      // 生成页面标题（完整路径展示）
      const displayDirName = dirPath.split('/').map(seg => showDate ? seg : pureDirName(seg)).join(' / ')
      photoGridTitle.innerText = `当前相册：${displayDirName}（共${node.files.length}张图片）`

      if (node.files.length === 0) {
        photoGrid.innerHTML = '<div class="empty-tip">该目录内暂无图片文件</div>'
        return
      }
      for (const fileName of node.files) {
        const imgSrc = getAssetUrl(dirPath, fileName)
        const card = document.createElement('div')
        card.className = 'photo-card'
        createThumbnail(imgSrc, thumbData => {
          card.innerHTML = `
            <img class="photo-card-thumb" src="${thumbData}">
            <div class="photo-fullname">${fileName}</div>
          `
        })
        // 点击打开大图详情
        card.addEventListener('click', () => {
          location.hash = `dir=${encodeURIComponent(dirPath)}&photo=${encodeURIComponent(fileName)}`
        })
        photoGrid.appendChild(card)
      }
    }

    // 切换日期显示复选框，重新渲染当前页面
    homeToggleDate.addEventListener('change', e => {
      showDate = e.target.checked
      switchPage(parseHash())
    })

    // 监听hash变化（浏览器前进后退、页面跳转）
    window.addEventListener('hashchange', () => switchPage(parseHash()))

    // 页面初始化入口
    window.onload = () => {
      showDate = homeToggleDate.checked
      buildDirectoryTree() // 一次性构建完整多级目录树
      switchPage(parseHash())
    }
  </script>
</body>
</html>
